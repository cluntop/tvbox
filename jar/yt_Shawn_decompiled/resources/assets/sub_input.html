<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>输入订阅地址</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            text-align: center;
            margin-bottom: 25px;
        }
        label {
            display: block;
            color: #555;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
            margin-bottom: 20px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .success {
            display: none;
            background: #4caf50;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-top: 20px;
            font-weight: 500;
        }
        .error {
            display: none;
            background: #f44336;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-top: 20px;
            font-weight: 500;
        }
        .tips {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }
        .tips strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📡 输入订阅地址</h1>
        <p class="subtitle">手机扫码输入，电视自动接收</p>
        
        <form id="subForm">
            <label for="subUrl">订阅地址（必填）</label>
            <input type="text" id="subUrl" name="url" placeholder="https://example.com/sub?token=..." required>
            
            <button type="submit">✓ 提交到电视</button>
        </form>
        
        <div class="success" id="successMsg">
            ✓ 提交成功！请返回电视查看
        </div>
        
        <div class="error" id="errorMsg">
            ✗ 提交失败，请检查网络连接
        </div>
        
        <div class="tips">
            <strong>提示：</strong><br>
            • 确保手机和电视在同一WiFi网络<br>
            • 提交后请返回电视端查看<br>
            • 订阅地址通常以 http:// 或 https:// 开头
        </div>
    </div>

    <script>
        document.getElementById('subForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const url = document.getElementById('subUrl').value.trim();
            if (!url) {
                showError('请输入订阅地址');
                return;
            }
            
            // POST 到电视端 /submit
            fetch('/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: 'url=' + encodeURIComponent(url)
            })
            .then(response => {
                if (response.ok) {
                    showSuccess();
                    document.getElementById('subUrl').value = '';
                } else {
                    showError('提交失败，请重试');
                }
            })
            .catch(err => {
                showError('网络错误，请检查连接');
            });
        });
        
        function showSuccess() {
            document.getElementById('successMsg').style.display = 'block';
            document.getElementById('errorMsg').style.display = 'none';
            setTimeout(() => {
                document.getElementById('successMsg').style.display = 'none';
            }, 3000);
        }
        
        function showError(msg) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
            document.getElementById('successMsg').style.display = 'none';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
