name: Update m3u

permissions:
  contents: write
  # actions: write
  # pull-requests: write      # 'write' access to pull requests

on:
  # schedule:
    # - cron: '0 * * * *' # 每小时执行一次
  workflow_dispatch:    # 允许手动触发

env:
  TZ: Asia/Shanghai

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        repository: cluntop/tvbox
        token: ${{ secrets.GIT_TOKEN }}
        fetch-depth: 1
        # sparse-checkout: |
        #   py/
        #   .github/requirements.txt

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: '.github/requirements.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r .github/requirements.txt

    - name: Run IPTV script
      run: |
        python py/get_iptv.py

    - name: Submit the changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

        if [ -n "$(git status --porcelain)" ]; then
          echo "Changes detected, committing..."
          git add .
          git commit -m "Update m3u"
          echo "PUSH_NEEDED=1" >> "$GITHUB_ENV"
        else
          echo "No changes detected, skipping push."
        fi

    - name: Push changes
      if: env.PUSH_NEEDED == '1'
      uses: ad-m/github-push-action@master
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
        pull: rebase   # pull --rebase before push; also accepts: merge | ff-only | true

